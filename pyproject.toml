[project]
name = "thai-alpr"
version = "0.1.0"
description = "Plugin-based Thai license plate recognition (YOLOv8 + OCR) with ESP32/MQTT integrations"
requires-python = ">=3.10"

[project.scripts]
thai-alpr = "thai_alpr.cli:main"

[tool.setuptools.packages.find]
include = ["thai_alpr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
